<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nolan｜時程表產生器</title>
<meta name="description" content="在瀏覽器排甘特式時程表：日／週／月時間軸、專案分色、拖曳編輯，可下載 PDF 或 JPG 放進企劃書。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Nolan｜時程表產生器">
<meta property="og:description" content="拖一拖就排好時程，下載 PDF／JPG 直接放進企劃書。">
<meta property="og:url" content="https://nolanchian.github.io/timeschedule/">
<meta property="og:image" content="https://nolanchian.github.io/timeschedule/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style id="page-style">@page{size:A4 landscape;margin:10mm}</style>
<style>
/* ================= 介面 tokens ================= */
:root{
  --bg:#f6f6f4; --surface:#fff; --subtle:#f2f2f0; --hover:#ececea; --border:#e8e8e5;
  --text:#1c1c1a; --muted:#8a8a85; --faint:#b8b8b3; --ink:#1c1c1a;
  --r:8px; --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:288px 1fr;grid-template-rows:56px 1fr;height:100vh}

/* 頂列 */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.doc-title{font-size:15px;font-weight:700;border:0;background:none;padding:6px 8px;border-radius:var(--r);width:220px;min-width:80px}
.doc-title:hover{background:var(--subtle)}
.doc-title:focus{outline:none;background:var(--subtle)}
.top .sp{flex:1}
.range{display:flex;align-items:center;gap:4px;color:var(--muted)}
.range input{width:132px}

/* 通用控制 */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:var(--r);background:none;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.ib{width:32px;padding:0;justify-content:center;color:var(--muted)}
.btn.ib:hover{color:var(--text)}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.ib.sm{width:28px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.danger:hover{color:#c0392b;background:#fbeceb}
.in{height:32px;width:100%;min-width:0;padding:0 10px;border:1px solid transparent;border-radius:var(--r);background:var(--subtle);transition:background .12s,border-color .12s}
.in:hover{background:var(--hover)}
.in:focus{outline:none;background:#fff;border-color:#d6d6d2}
select.in{padding-right:4px}
.bare{height:30px;width:100%;min-width:0;padding:0 6px;border:0;border-radius:6px;background:none}
.bare:hover{background:var(--subtle)}
.bare:focus{outline:none;background:var(--subtle)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r);background:var(--subtle)}
.seg button{height:26px;min-width:36px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:#dcdcd8;position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(14px)}

/* 下拉選單 */
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:38px;z-index:30;min-width:168px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.pop button{display:flex;width:100%;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left}
.pop button:hover{background:var(--subtle)}

/* 側欄 */
.side{background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:12px 10px 24px}
.blk+.blk{margin-top:20px}
.blk-h{display:flex;align-items:center;gap:4px;padding:0 4px 0 8px;height:32px}
.blk-h h3{margin:0;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;flex:1}
.blk-h .n{font-size:12px;color:var(--faint);margin-right:2px}
.plist,.tlist{list-style:none;margin:0;padding:0}
.pitem{display:flex;align-items:center;gap:4px;height:34px;padding:0 4px 0 8px;border-radius:var(--r)}
.pitem:hover{background:var(--subtle)}
.pitem .cnt{font-size:12px;color:var(--faint);min-width:18px;text-align:right}
.pitem .btn{opacity:0}
.pitem:hover .btn,.pitem:focus-within .btn{opacity:1}
.pdot{position:relative;width:14px;height:14px;border-radius:4px;background:var(--c);flex:none;cursor:pointer;margin-right:2px}
.pdot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.titem{border-radius:var(--r)}
.titem.open{background:var(--subtle);margin:4px 0}
.trow{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;background:none;border-radius:var(--r);text-align:left}
.titem:not(.open) .trow:hover{background:var(--subtle)}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.titem.sec .tname{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.04em}
.glyph{width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center}
.glyph::before{content:"";background:var(--c)}
.glyph.bar::before{width:14px;height:6px;border-radius:2px}
.glyph.dot::before{width:8px;height:8px;border-radius:50%}
.glyph.diamond::before{width:8px;height:8px;transform:rotate(45deg)}
.glyph.flag::before{width:10px;height:8px;clip-path:polygon(0 0,100% 0,50% 100%)}
.glyph.section::before{width:12px;height:2px;background:var(--faint);box-shadow:0 4px 0 var(--faint)}
.tdetail{padding:4px 10px 10px;display:grid;gap:10px}
.tdetail .in{background:#fff}
.tdetail .in:hover{background:#fff;border-color:var(--border)}
.f{display:grid;gap:4px}
.f>span{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tdetail .seg{background:#fff;display:grid}
.tdetail .seg button{min-width:0;padding:0}
.tdetail .seg button.on{background:var(--subtle);box-shadow:none}
.tfoot{display:flex;gap:2px;justify-content:flex-end;margin-top:2px}
.addbar{display:flex;gap:2px;padding:4px 0 0}
.addbar .btn{color:var(--muted)}
.addbar .btn:hover{color:var(--text)}

/* 設定視窗 */
dialog.set{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 64px);padding:0;border:0;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.18);color:var(--text)}
dialog.set::backdrop{background:rgba(20,20,18,.28)}
.set-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;padding:16px 16px 12px 24px;background:#fff}
.set-h h2{margin:0;font-size:16px;flex:1}
.set-b{padding:0 24px 24px}
.set-b h4{margin:20px 0 6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.set-b h4:first-child{margin-top:4px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid var(--subtle)}
.fr>span{font-size:13px}
.fr>span small{display:block;color:var(--muted);font-size:12px}
.fr .ctl{display:flex;justify-content:flex-end;min-width:200px}
.seg button{white-space:nowrap}
.fr input[type=color]{width:48px;height:28px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer}
.colrow{display:grid;grid-template-columns:1fr 120px 64px auto;gap:6px;align-items:center;padding:4px 0}

/* 畫布 */
.main{overflow:auto;position:relative}
.stage{padding:32px;min-width:min-content}
.chart-wrap{display:inline-block;background:#fff;padding:40px 40px 44px;border-radius:12px;border:1px solid var(--border)}

/* ================= 時程表本體 ================= */
.chart{--fs:1;--primary:#5b9e9b;--head:#f2f2f0;--line:#d4d4d0;font-family:var(--font);color:#222}
.chart [contenteditable]{outline:none;cursor:text;border-radius:2px}
.chart [contenteditable]:hover{box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.chart [contenteditable]:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 50%,transparent)}
.c-title{font-size:calc(24px*var(--fs));font-weight:700;margin:0 0 14px;display:inline-block;min-width:4em}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 24px;font-size:calc(14px*var(--fs));color:#444}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:calc(12px*var(--fs));height:calc(12px*var(--fs));border-radius:2px;background:var(--c)}
.c-grid{display:grid;column-gap:12px}
.c-head{row-gap:8px;margin-bottom:18px}
.groups,.units{display:flex}
.g{padding:0 2px;height:calc(46px*var(--fs))}
.g span{display:flex;align-items:center;justify-content:center;height:100%;background:var(--head);font-weight:700;font-size:calc(16px*var(--fs));white-space:nowrap;overflow:hidden}
.u{height:calc(42px*var(--fs));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary);font-size:calc(15px*var(--fs));line-height:1.15;white-space:nowrap;overflow:hidden}
.u small{font-size:calc(10px*var(--fs));opacity:.8}
.u.we{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.axis{display:flex}
.axis-box{flex:1;height:calc(42px*var(--fs));display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primary);font-size:calc(15px*var(--fs));letter-spacing:.06em}
.xh{display:flex;align-items:center;height:calc(42px*var(--fs));font-size:calc(15px*var(--fs));color:#555;white-space:nowrap}
.xh.c{justify-content:center}
.lab{min-width:0;cursor:grab;user-select:none;-webkit-user-select:none}
.lab-box[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text}
.lab.dragging-src{opacity:.35}
.lab-box{height:100%;background:var(--pc);color:var(--pt);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:calc(15px*var(--fs));padding:0 10px;overflow:hidden;white-space:nowrap}
.lab.sec .lab-box{background:none;color:#333;justify-content:flex-start;padding:0 2px;border-bottom:2px solid #333;font-size:calc(16px*var(--fs))}
.xc{display:flex;align-items:center;font-size:calc(15px*var(--fs));white-space:nowrap;overflow:hidden;min-width:0}
.xc.c{justify-content:center}
.xc.st{cursor:pointer;color:var(--pc)}
.xc.dt{color:#555;font-variant-numeric:tabular-nums}
.tl{position:relative;margin:-8px 0;background:#fff}
.tl::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;z-index:2}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed #e4e4e1;z-index:1}
.gl.g2{border-left:1px solid var(--line)}
.shade{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--primary) 6%,transparent)}
.band{position:absolute;left:0;right:0;background:var(--head)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid #e4572e;z-index:4;pointer-events:none}
.today span{position:absolute;bottom:calc(-22px*var(--fs));left:-14px;font-size:calc(11px*var(--fs));color:#e4572e;white-space:nowrap}
.it{position:absolute;z-index:3;cursor:grab;touch-action:none}
.it:active{cursor:grabbing}
.it.bar{background:var(--c)}
.it.bar .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}
.it.bar .h.l{left:-5px}.it.bar .h.r{right:-5px}
.it.bar .bt{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);font-size:calc(12px*var(--fs));color:var(--ct);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.it.pt{transform:translate(-50%,-50%);background:var(--c)}
.it.dot{width:calc(16px*var(--fs));height:calc(16px*var(--fs));border-radius:50%}
.it.diamond{width:calc(22px*var(--fs));height:calc(22px*var(--fs));transform:translate(-50%,-50%) rotate(45deg)}
.it.flag{width:calc(20px*var(--fs));height:calc(18px*var(--fs));clip-path:polygon(0 0,100% 0,50% 100%)}
.it.dragging{opacity:.85}
.empty{padding:48px;color:#999;text-align:center;border:1px dashed var(--line)}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;display:none}

/* 拖曳排序與右鍵選單 */
.dropline{position:fixed;height:2px;background:var(--ink);border-radius:1px;z-index:60;pointer-events:none;display:none}
.dropline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
body.reordering,body.reordering *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.titem.dragging-src{opacity:.35}
.ctx{position:fixed;top:0;left:0;right:auto;min-width:210px;max-height:calc(100vh - 16px);overflow:auto}
.ctx .ch{padding:6px 10px 4px;font-size:12px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .ch.t{color:var(--text);font-weight:700;font-size:13px}
.ctx hr{border:0;border-top:1px solid var(--subtle);margin:4px 0}
.ctx .sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.ctx .ck{margin-left:auto;padding-left:12px;font-size:12px}
.ctx .glyph{margin:0 1px}
.ctx button.danger:hover{color:#c0392b;background:#fbeceb}
.pop button:disabled{opacity:.35;pointer-events:none}
.side-hint{padding:14px 8px 0;font-size:12px;color:var(--faint);line-height:1.7}

/* 圖上日期標示 */
.dm{position:absolute;z-index:3;font-size:calc(12px*var(--fs));color:#666;white-space:nowrap;transform:translateY(-50%);pointer-events:none;font-variant-numeric:tabular-nums;line-height:1}
.dm.l{transform:translate(-100%,-50%);padding-right:6px}
.dm.r{padding-left:6px}
.dm.in{color:var(--ct);padding-left:6px}
@media print{.hide-today-print .today{display:none}}
.chart.no-today .today{display:none}
.xc.st svg{width:calc(24px*var(--fs));height:calc(24px*var(--fs))}
/* 換行模式：任務名稱與文字欄可多行，列高自動長高 */
.chart.wrap .lab-box{white-space:normal;line-height:1.3;padding:calc(6px*var(--fs)) 10px;word-break:break-word}
.chart.wrap .lab.sec .lab-box{padding:calc(4px*var(--fs)) 2px}
.chart.wrap .xc{white-space:normal;line-height:1.35;padding:calc(4px*var(--fs)) 0;word-break:break-word}
.chart.wrap .xh{white-space:normal;line-height:1.3}
.chart.exporting:has(.today):not(.no-today){padding-bottom:calc(24px*var(--fs))}
.chart.exporting [contenteditable]:hover{box-shadow:none}
.pv{display:flex;align-items:center;gap:16px;padding:4px 0 12px;border-bottom:1px solid var(--subtle)}
.pv-page{flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #d6d6d2;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pv-chart{background:repeating-linear-gradient(180deg,#cfcfca 0 3px,transparent 3px 7px);border-radius:1px}
.pv-t{font-size:14px;font-weight:700}
.pv-t small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
/* 匯出視窗 */
dialog.set.exp{width:min(440px,calc(100vw - 32px))}
.exp-act{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.exp-note{font-size:12px;color:var(--muted);margin-top:10px;text-align:right}
.fr .off{font-size:12px;color:var(--faint)}

/* 使用導覽 */
.tour[hidden]{display:none}
.tour-block{position:fixed;inset:0;z-index:80}
.tour-hole{position:fixed;z-index:81;border-radius:10px;pointer-events:none;box-shadow:0 0 0 9999px rgba(20,20,18,.5),0 0 0 2px rgba(255,255,255,.9);transition:left .28s ease,top .28s ease,width .28s ease,height .28s ease}
.tour-card{position:fixed;z-index:82;width:340px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px;padding:20px 20px 16px;box-shadow:0 20px 48px rgba(0,0,0,.22);transition:left .28s ease,top .28s ease}
.tour-n{font-size:12px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.tour-card h3{margin:0 0 6px;font-size:17px}
.tour-card p{margin:0;font-size:14px;line-height:1.7;color:#444}
.tour-f{display:flex;align-items:center;gap:6px;margin-top:16px}
.tour-dots{display:flex;gap:5px;flex:1}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:#dcdcd8}
.tour-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.demo{position:relative;height:84px;margin-top:14px;border-radius:10px;background:var(--subtle);overflow:hidden}
.demo .cur{position:absolute;width:16px;height:16px;z-index:3;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.d-drag .grid{position:absolute;inset:10px 16px;background:repeating-linear-gradient(90deg,transparent 0 47px,#dcdcd8 47px 48px);border:1px solid #dcdcd8;background-color:#fff}
.d-drag .bar{position:absolute;left:64px;top:32px;width:96px;height:20px;background:var(--ink);animation:tDrag 3.2s ease-in-out infinite}
.d-drag .cur{left:104px;top:42px;animation:tDrag 3.2s ease-in-out infinite}
@keyframes tDrag{0%,18%{transform:translateX(0)}48%,64%{transform:translateX(96px)}92%,100%{transform:translateX(0)}}
.d-reo .r{position:absolute;left:24px;right:24px;height:18px;border-radius:5px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:11px;color:#555}
.d-reo .r i{width:12px;height:5px;border-radius:2px;background:var(--c)}
.d-reo .a{top:12px;z-index:2;animation:tReoA 3.2s ease-in-out infinite}
.d-reo .b{top:34px;animation:tReoB 3.2s ease-in-out infinite}
.d-reo .c{top:56px;animation:tReoB 3.2s ease-in-out infinite}
.d-reo .cur{left:120px;top:18px;animation:tReoA 3.2s ease-in-out infinite}
@keyframes tReoA{0%,15%{transform:none}45%,68%{transform:translateY(44px)}92%,100%{transform:none}}
@keyframes tReoB{0%,22%{transform:none}45%,68%{transform:translateY(-22px)}88%,100%{transform:none}}
.d-ctx .lab{position:absolute;left:20px;top:28px;width:110px;height:26px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;animation:tCtxC 3.6s infinite}
.d-ctx .menu{position:absolute;left:118px;top:8px;width:120px;padding:5px;background:#fff;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.14);transform-origin:top left;animation:tCtxM 3.6s infinite}
.d-ctx .menu div{display:flex;align-items:center;gap:6px;height:16px;padding:0 5px;font-size:10px;color:#444;border-radius:4px}
.d-ctx .menu div i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.d-ctx .menu div.hl{background:var(--subtle)}
.d-ctx .cur{left:108px;top:38px}
@keyframes tCtxM{0%,20%{opacity:0;transform:scale(.9)}28%,78%{opacity:1;transform:none}86%,100%{opacity:0;transform:scale(.95)}}

<script>
(() => {
'use strict';
/* ================= 工具函式 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const DAY = 86400000;
const toDay = s => { const [y, m, d] = String(s).split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const toStr = n => new Date(n * DAY).toISOString().slice(0, 10);
const ymd = n => { const d = new Date(n * DAY); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), d.getUTCDay()]; };
const mStart = (y, m) => Math.round(Date.UTC(y, m - 1, 1) / DAY);
const mEnd = (y, m) => Math.round(Date.UTC(y, m, 0) / DAY);
const md = n => { const [, m, d] = ymd(n); return `${m}/${d}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const isHex = s => /^#[0-9a-f]{6}$/i.test(s || '');
const todayDay = () => { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY); };
// 依底色亮度決定文字用深或白
const inkOn = hex => { const n = parseInt(hex.slice(1), 16); const L = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; return L > 0.62 ? '#1c1c1a' : '#ffffff'; };

const ICONS = {
  plus: 'M8 3.5v9M3.5 8h9',
  undo: 'M6 3.5 3 6.5l3 3M3 6.5h6.5a3.5 3.5 0 0 1 0 7H8',
  redo: 'M10 3.5l3 3-3 3M13 6.5H6.5a3.5 3.5 0 0 0 0 7H8',
  sliders: 'M2.5 5h11M2.5 11h11M6 3.5v3M10 9.5v3',
  chev: 'M4.5 6.5 8 10l3.5-3.5',
  print: 'M8 2.5v8m-3.2-3.2L8 10.5l3.2-3.2M3 13.5h10',
  up: 'M8 12.5v-9M4.5 7 8 3.5 11.5 7',
  down: 'M8 3.5v9M4.5 9 8 12.5 11.5 9',
  copy: 'M5.5 5.5h7v7h-7zM3.5 10.5v-7h7',
  trash: 'M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5',
  x: 'M4 4l8 8M12 4l-8 8',
  sort: 'M3 4h10M3 8h7M3 12h4',
  help: 'M8 14.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM6.1 6.2a1.95 1.95 0 0 1 3.8.5c0 1.3-1.9 1.6-1.9 2.8M8 11.6v.1',
  file: 'M4 2.5h5l3 3v8H4zM9 2.5v3h3',
  open: 'M2.5 4.5h4l1.5 1.5h5.5v7h-11z',
  save: 'M8 2.5v7m-3-3 3 3 3-3M3 13.5h10',
  newdoc: 'M4 2.5h5l3 3v8H4zM8 7v4M6 9h4',
};
const ic = n => `<svg class="i" viewBox="0 0 16 16"><path d="${ICONS[n]}"/></svg>`;

const TYPES = { bar: '期間', dot: '單日', diamond: '舉辦日', flag: '截止日', section: '分組標題' };
const COLTYPES = { text: '文字', status: '進度圓餅', dates: '日期（自動）' };
const PALETTE = ['#5b9e9b', '#2f5d8a', '#d9822b', '#4f8a4b', '#c44569', '#7a5ea8', '#1c1c1a', '#b0884f'];
const PAPER = { A4: [210, 297], A3: [297, 420] }; // 短邊、長邊（mm）
const MARGIN = 10;
const LIBS = {
  h2i: 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js',
  pdf: 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js',
};

function defaultState() {
  const c1 = uid(), c2 = uid(), p1 = uid(), p2 = uid();
  const r = (name, project, type, s, e, owner, st) => ({ id: uid(), name, type, project, start: s, end: e, fields: { [c1]: owner, [c2]: st } });
  return {
    version: 2,
    title: '年會籌備時程', showTitle: true, showLegend: true,
    unit: 'week', weekMode: 'month4', weekLabel: 'index', showWeekday: true,
    start: '2026-11-01', end: '2026-12-31',
    axisLabel: 'WEEK',
    colWidth: { day: 30, week: 104, month: 120 },
    labelWidth: 230, rowHeight: 36, rowGap: 12,
    theme: { primary: '#5b9e9b', head: '#f2f2f0' },
    fontScale: 1, wrap: false, showCols: true,
    showToday: true, printToday: true, dateMarks: 'none', gridLines: 'group', shadeWeekend: true, barText: false,
    paperSize: 'A4', orient: 'auto', fillPage: true, exportFormat: 'pdf',
    projects: [{ id: p1, name: '活動執行', color: '#1c1c1a' }, { id: p2, name: '行政財務', color: '#5b9e9b' }],
    columns: [{ id: c1, name: '負責人', type: 'text', width: 130 }, { id: c2, name: '狀態', type: 'status', width: 70 }],
    rows: [
      r('交稿與預錄回覆', p1, 'bar', '2026-11-15', '2026-11-19', '議程窗口', 25),
      r('議程與宣傳發布', p1, 'bar', '2026-11-15', '2026-11-21', '美術 / 社群', 25),
      r('人力補位與主管交接', p2, 'bar', '2026-11-15', '2026-11-22', '林瀚', 0),
      r('餐飲與次會場確認', p1, 'bar', '2026-11-15', '2026-11-22', '餐飲 / 場務', 0),
      r('預算分攤與憑證', p2, 'bar', '2026-11-15', '2026-11-24', '財務長', 0),
      r('影片與簡報試播', p1, 'bar', '2026-11-22', '2026-12-03', '林世均', 0),
      r('名冊餐券與行前通知', p1, 'bar', '2026-11-26', '2026-12-04', '報到 / 總控', 0),
      r('活動當日', p1, 'diamond', '2026-12-05', '2026-12-05', '全體', 0),
    ],
  };
}

function normalize(s) {
  const d = defaultState();
  const o = Object.assign({}, d, s);
  o.version = 2;
  o.theme = { primary: isHex(s.theme?.primary) ? s.theme.primary : d.theme.primary, head: isHex(s.theme?.head) ? s.theme.head : d.theme.head };
  o.colWidth = Object.assign({}, d.colWidth, s.colWidth);
  // v1 沒有專案：建立一個專案承接全部任務
  let projects = Array.isArray(s.projects) ? s.projects : null;
  if (!projects || !projects.length) projects = [{ id: uid(), name: '專案 1', color: isHex(s.theme?.label) ? s.theme.label : '#1c1c1a' }];
  o.projects = projects.map((p, i) => ({ id: p.id || uid(), name: p.name ?? `專案 ${i + 1}`, color: isHex(p.color) ? p.color : PALETTE[i % PALETTE.length] }));
  const pids = new Set(o.projects.map(p => p.id));
  o.columns = (Array.isArray(s.columns) ? s.columns : d.columns).map(c => ({ id: c.id || uid(), name: c.name ?? '', type: COLTYPES[c.type] ? c.type : 'text', width: +c.width || 110 }));
  o.rows = (Array.isArray(s.rows) ? s.rows : []).map(r => {
    const start = isDate(r.start) ? r.start : o.start;
    return { id: r.id || uid(), name: r.name ?? '', type: TYPES[r.type] ? r.type : 'bar', project: pids.has(r.project) ? r.project : o.projects[0].id, start, end: isDate(r.end) ? r.end : start, fields: r.fields || {} };
  });
  if (!isDate(o.start)) o.start = d.start;
  if (!isDate(o.end)) o.end = d.end;
  if (s.paper && !s.paperSize) { o.paperSize = s.paper.startsWith('A3') ? 'A3' : 'A4'; o.orient = s.paper.endsWith('P') ? 'portrait' : 'landscape'; }
  if (!PAPER[o.paperSize]) o.paperSize = 'A4';
  if (!['auto', 'landscape', 'portrait'].includes(o.orient)) o.orient = 'auto';
  delete o.paper; delete o.fitPage;
  if (!['pdf', 'jpg'].includes(o.exportFormat)) o.exportFormat = 'pdf';
  delete o.jpgLayout;
  if (![1, 1.3, 1.6].includes(o.fontScale)) o.fontScale = 1;
  if (!['none', 'start', 'range'].includes(o.dateMarks)) o.dateMarks = 'none';
  delete o.labelColor;
  return o;
}

/* ================= 狀態、儲存、歷史 ================= */
const KEY = 'timeschedule.v1';
let state;
try { const raw = localStorage.getItem(KEY); state = raw ? normalize(JSON.parse(raw)) : defaultState(); } catch { state = defaultState(); }
let lastSnap = JSON.stringify(state);
const undoStack = [], redoStack = [];
let openRow = null; // 側欄展開中的任務

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
function checkpoint() {
  const now = JSON.stringify(state);
  if (now === lastSnap) return;
  undoStack.push(lastSnap); if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0; lastSnap = now; save(); updateUndoBtns();
}
function restore(snap) { state = JSON.parse(snap); save(); renderAll(); }
function undo() { checkpoint(); if (!undoStack.length) return; redoStack.push(lastSnap); lastSnap = undoStack.pop(); restore(lastSnap); }
function redo() { if (!redoStack.length) return; undoStack.push(lastSnap); lastSnap = redoStack.pop(); restore(lastSnap); }
function updateUndoBtns() {
  const u = $('[data-tb="undo"]'), r = $('[data-tb="redo"]');
  if (u) u.disabled = !undoStack.length && JSON.stringify(state) === lastSnap;
  if (r) r.disabled = !redoStack.length;
}
const findRow = id => state.rows.find(r => r.id === id);
const findCol = id => state.columns.find(c => c.id === id);
const findProj = id => state.projects.find(p => p.id === id) || state.projects[0];
const rowColor = r => findProj(r.project).color;

/* ================= 時間軸計算 ================= */
let COLS = [];
function buildCols(S) {
  let s = toDay(S.start), e = toDay(S.end);
  if (e < s) [s, e] = [e, s];
  const cols = [];
  const [sy, sm] = ymd(s), [ey, em] = ymd(e);
  const multiYear = sy !== ey;
  const mLabel = (y, m) => multiYear ? `${y}年${m}月` : `${m}月`;
  const WD = '日一二三四五六';
  const months = fn => { for (let y = sy, m = sm; y * 12 + m <= ey * 12 + em; m === 12 ? (y++, m = 1) : m++) fn(y, m); };
  if (S.unit === 'day') {
    for (let d = s; d <= e; d++) {
      const [y, m, dd, wd] = ymd(d);
      cols.push({ s: d, e: d, label: String(dd), sub: S.showWeekday ? WD[wd] : '', group: mLabel(y, m), gk: y * 12 + m, weekend: wd === 0 || wd === 6 });
    }
  } else if (S.unit === 'month') {
    months((y, m) => cols.push({ s: mStart(y, m), e: mEnd(y, m), label: `${m}月`, group: `${y}年`, gk: y }));
  } else if (S.weekMode === 'iso') {
    const gMin = sy * 12 + sm, gMax = ey * 12 + em;
    let lastGk = null, idx = 0;
    for (let d = s - ((ymd(s)[3] + 6) % 7); d <= e; d += 7) {
      // 一週歸屬於週四所在月份，但不超出範圍首尾月份
      const [ty, tm] = ymd(d + 3), [, m, dd] = ymd(d);
      const gk = Math.min(Math.max(ty * 12 + tm, gMin), gMax);
      const gy = Math.floor((gk - 1) / 12), gm = gk - gy * 12;
      idx = gk === lastGk ? idx + 1 : 1; lastGk = gk;
      cols.push({ s: d, e: d + 6, label: S.weekLabel === 'date' ? `${m}/${dd}` : String(idx), group: mLabel(gy, gm), gk });
    }
  } else {
    months((y, m) => {
      const ms = mStart(y, m), me = mEnd(y, m);
      for (let k = 0; k < 4; k++) {
        const ws = ms + 7 * k, we = k < 3 ? ws + 6 : me;
        cols.push({ s: ws, e: we, label: S.weekLabel === 'date' ? `${m}/${1 + 7 * k}` : String(k + 1), group: mLabel(y, m), gk: y * 12 + m });
      }
    });
  }
  const groups = [];
  cols.forEach((c, i) => {
    const g = groups[groups.length - 1];
    if (g && g.gk === c.gk) g.count++; else groups.push({ gk: c.gk, label: c.group, count: 1, first: i });
  });
  return { cols, groups };
}
function colIndex(d) {
  let lo = 0, hi = COLS.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (COLS[mid].e < d) lo = mid + 1; else hi = mid; }
  return lo;
}
function fracOf(d, mode) {
  const N = COLS.length; if (!N) return 0;
  if (d < COLS[0].s) return 0;
  if (d > COLS[N - 1].e) return 1;
  const i = colIndex(d), c = COLS[i], len = c.e - c.s + 1;
  return (i + (d - c.s + (mode === 'start' ? 0 : mode === 'end' ? 1 : 0.5)) / len) / N;
}
function fracToDay(f) {
  const N = COLS.length;
  const x = Math.min(Math.max(f, 0), 0.999999) * N, i = Math.floor(x), c = COLS[i];
  return c.s + Math.floor((x - i) * (c.e - c.s + 1));
}
function rowDates(r) {
  let a = toDay(r.start), b = toDay(r.end || r.start);
  if (r.type !== 'bar') b = a;
  if (b < a) [a, b] = [b, a];
  return [a, b];
}
function datesText(r) {
  if (r.type === 'section') return '';
  const [a, b] = rowDates(r);
  return a === b ? md(a) : `${md(a)}–${md(b)}`;
}

/* ================= 圖表渲染 ================= */
const chart = $('#chart');
function pie(p) {
  p = +p || 0; const r = 9.5, c = 12;
  let fill = '';
  if (p >= 100) fill = `<circle cx="${c}" cy="${c}" r="${r}" fill="currentColor"/>`;
  else if (p > 0) {
    const a = p / 100 * 2 * Math.PI, x = c + r * Math.sin(a), y = c - r * Math.cos(a);
    fill = `<path d="M${c} ${c}L${c} ${c - r}A${r} ${r} 0 ${p > 50 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="currentColor"/>`;
  }
  return `<svg width="24" height="24" viewBox="0 0 24 24" aria-label="${p}%">${fill}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
}
const PAD = 8;
function renderChart() {
  const S = state;
  const { cols, groups } = buildCols(S); COLS = cols;
  const N = cols.length, cw = S.colWidth[S.unit] || 60, W = N * cw;
  chart.style.setProperty('--primary', S.theme.primary);
  chart.style.setProperty('--head', S.theme.head);
  const fs = S.fontScale || 1, XC = S.showCols ? S.columns : [];
  chart.style.setProperty('--fs', fs);
  chart.classList.toggle('wrap', !!S.wrap);
  const gridCols = [S.labelWidth + 'px', W + 'px', ...XC.map(c => Math.round(c.width * (fs > 1 ? (1 + fs) / 2 : 1)) + 'px')].join(' ');
  const ce = 'contenteditable="plaintext-only" spellcheck="false"';
  let h = '';
  if (S.showTitle) h += `<div><div class="c-title" ${ce} data-edit="title">${esc(S.title)}</div></div>`;
  if (S.showLegend) {
    const used = S.projects.filter(p => S.rows.some(r => r.type !== 'section' && r.project === p.id));
    if (used.length) h += `<div class="legend">${used.map(p => `<span><i style="--c:${p.color}"></i>${esc(p.name)}</span>`).join('')}</div>`;
  }
  h += `<div class="c-grid c-head" style="grid-template-columns:${gridCols}">`;
  h += `<div></div><div class="groups">${groups.map(g => `<div class="g" style="width:${g.count * cw}px"><span>${esc(g.label)}</span></div>`).join('')}</div>${XC.map(() => '<div></div>').join('')}`;
  h += `<div class="axis"><div class="axis-box" ${ce} data-edit="axisLabel">${esc(S.axisLabel)}</div></div>`;
  h += `<div class="units">${cols.map(c => `<div class="u${c.weekend && S.shadeWeekend ? ' we' : ''}" style="width:${cw}px">${esc(c.label)}${c.sub ? `<small>${c.sub}</small>` : ''}</div>`).join('')}</div>`;
  h += XC.map(c => `<div class="xh${c.type === 'text' ? '' : ' c'}" ${ce} data-edit="colname" data-col="${c.id}">${esc(c.name)}</div>`).join('');
  h += `</div>`;

  const n = S.rows.length, rh = Math.round(S.rowHeight * fs), gap = Math.round(S.rowGap * fs);
  if (!n) {
    h += `<div class="empty">還沒有任務，從左側「任務」新增</div>`;
  } else {
    h += `<div class="c-grid" style="grid-template-columns:${gridCols};grid-template-rows:repeat(${n},${S.wrap ? `minmax(${rh}px,auto)` : rh + 'px'});row-gap:${gap}px">`;
    S.rows.forEach((r, i) => {
      const gr = `grid-row:${i + 1}`, pc = rowColor(r);
      const pv = `--pc:${pc};--pt:${inkOn(pc)}`;
      h += `<div class="lab${r.type === 'section' ? ' sec' : ''}" style="grid-column:1;${gr};${pv}" data-open="${r.id}"><div class="lab-box" data-edit="rowname" data-row="${r.id}" title="拖曳排序・雙擊改名・右鍵改顏色與類型">${esc(r.name)}</div></div>`;
      XC.forEach((c, j) => {
        const pos = `grid-column:${j + 3};${gr};${pv}`;
        if (r.type === 'section') { h += `<div style="${pos}"></div>`; return; }
        const v = r.fields[c.id];
        if (c.type === 'status') h += `<div class="xc st c" style="${pos}" data-act="status" data-row="${r.id}" data-col="${c.id}" title="點一下切換進度">${pie(v)}</div>`;
        else if (c.type === 'dates') h += `<div class="xc dt" style="${pos}">${datesText(r)}</div>`;
        else h += `<div class="xc" style="${pos}" ${ce} data-edit="field" data-row="${r.id}" data-col="${c.id}">${esc(v)}</div>`;
      });
    });
    let tl = '';
    if (S.unit === 'day' && S.shadeWeekend) cols.forEach((c, i) => { if (c.weekend) tl += `<div class="shade" style="left:${i * cw}px;width:${cw}px"></div>`; });
    S.rows.forEach((r, i) => { if (r.type === 'section') tl += `<div class="band" data-ri="${i}" style="top:${PAD + i * (rh + gap)}px;height:${rh}px"></div>`; });
    const gStart = new Set(groups.map(g => g.first));
    for (let i = 1; i < N; i++) {
      if (S.gridLines !== 'none' && gStart.has(i)) tl += `<div class="gl g2" style="left:${i * cw}px"></div>`;
      else if (S.gridLines === 'all') tl += `<div class="gl" style="left:${i * cw}px"></div>`;
    }
    S.rows.forEach((r, i) => {
      if (r.type === 'section') return;
      const cy = PAD + i * (rh + gap) + rh / 2, color = rowColor(r), [a, b] = rowDates(r);
      const tip = esc(`${r.name}｜${datesText(r)}`);
      if (r.type === 'bar') {
        const x1 = fracOf(a, 'start') * W, x2 = fracOf(b, 'end') * W, bh = Math.round(rh * 0.92);
        tl += `<div class="it bar" data-ri="${i}" data-row="${r.id}" data-tip="${tip}" style="--c:${color};--ct:${inkOn(color)};left:${x1}px;width:${Math.max(x2 - x1, 3)}px;top:${cy - bh / 2}px;height:${bh}px"><i class="h l"></i><i class="h r"></i>${S.barText ? `<span class="bt">${esc(r.name)}</span>` : ''}</div>`;
      } else {
        tl += `<div class="it pt ${r.type}" data-ri="${i}" data-row="${r.id}" data-tip="${tip}" style="--c:${color};left:${fracOf(a, 'mid') * W}px;top:${cy}px"></div>`;
      }
      if (S.dateMarks !== 'none') {
        if (r.type === 'bar') {
          const x1 = fracOf(a, 'start') * W, x2 = fracOf(b, 'end') * W;
          // 起點太靠左邊界時，日期改放進橫條內
          tl += x1 >= 44 ? `<span class="dm l" data-ri="${i}" style="left:${x1}px;top:${cy}px">${md(a)}</span>`
            : `<span class="dm in" data-ri="${i}" style="left:${x1}px;top:${cy}px;--ct:${inkOn(color)}">${md(a)}</span>`;
          if (S.dateMarks === 'range' && b !== a) tl += `<span class="dm r" data-ri="${i}" style="left:${x2}px;top:${cy}px">${md(b)}</span>`;
        } else {
          const x = fracOf(a, 'mid') * W;
          tl += x >= 50 ? `<span class="dm l" data-ri="${i}" style="left:${x - 14}px;top:${cy}px">${md(a)}</span>`
            : `<span class="dm r" data-ri="${i}" style="left:${x + 14}px;top:${cy}px">${md(a)}</span>`;
        }
      }
    });
    if (S.showToday && N) {
      const t = todayDay();
      if (t >= COLS[0].s && t <= COLS[N - 1].e) tl += `<div class="today" style="left:${fracOf(t, 'mid') * W}px"><span>今天 ${md(t)}</span></div>`;
    }
    h += `<div class="tl" style="grid-column:2;grid-row:1/${n + 1};width:${W}px">${tl}</div></div>`;
  }
  chart.innerHTML = h;
  chart.classList.toggle('hide-today-print', !S.printToday);
  if (S.wrap && n) alignRows();
}
// 換行模式下每列高度不同：依標籤實際位置重新對齊橫條、圖示與日期
function alignRows() {
  const tl = $('.tl', chart); if (!tl) return;
  const z = (tl.getBoundingClientRect().width / tl.offsetWidth) || 1, t0 = tl.getBoundingClientRect().top / z + tl.clientTop;
  const rows = $$('.lab', chart).map(l => { const r = l.getBoundingClientRect(); return { top: r.top / z - t0, h: r.height / z }; });
  $$('[data-ri]', tl).forEach(el => {
    const R = rows[+el.dataset.ri]; if (!R) return;
    const cy = R.top + R.h / 2;
    if (el.classList.contains('band')) { el.style.top = R.top + 'px'; el.style.height = R.h + 'px'; }
    else if (el.classList.contains('bar')) el.style.top = (cy - el.offsetHeight / 2) + 'px';
    else el.style.top = cy + 'px';
  });
}

// 依圖表尺寸算出紙張方向與縮放（k：每 px 對應的 mm）
function pageLayout(w, h) {
  const [sh, lo] = PAPER[state.paperSize] || PAPER.A4;
  const fit = (pw, ph) => Math.min((pw - 2 * MARGIN) / w, (ph - 2 * MARGIN) / h);
  let o = state.orient;
  if (o === 'auto') o = fit(lo, sh) >= fit(sh, lo) ? 'landscape' : 'portrait';
  const [pw, ph] = o === 'landscape' ? [lo, sh] : [sh, lo];
  const k = fit(pw, ph);
  return { o, pw, ph, k, dw: w * k, dh: h * k };
}
// 「延展填滿」：列高與列距固定和畫面一致；只有圖比紙張瘦長時，加寬時間格貼近紙張比例
function planStretch(w, h) {
  const S = state, N = COLS.length;
  const p = { rh: S.rowHeight, gap: S.rowGap, cw: S.colWidth[S.unit], w, h };
  if (!S.fillPage) return p;
  const L = pageLayout(w, h), A = (L.pw - 2 * MARGIN) / (L.ph - 2 * MARGIN);
  if (w / h < A && N) {
    p.cw = Math.min(S.colWidth[S.unit] * 2.5, S.colWidth[S.unit] + (h * A - w) / N);
    p.w = w + N * (p.cw - S.colWidth[S.unit]);
  }
  return p;
}
function applyStretch() {
  const S = state, o = { rh: S.rowHeight, gap: S.rowGap, cw: S.colWidth[S.unit] };
  const p = planStretch(chart.scrollWidth, chart.scrollHeight);
  S.rowHeight = Math.round(p.rh); S.rowGap = Math.round(p.gap); S.colWidth[S.unit] = Math.round(p.cw);
  renderChart();
  return () => { S.rowHeight = o.rh; S.rowGap = o.gap; S.colWidth[S.unit] = o.cw; renderChart(); };
}
function pagePreview() {
  const p = planStretch(chart.scrollWidth || 1, chart.scrollHeight || 1);
  const L = pageLayout(p.w, p.h), u = 150 / Math.max(L.pw, L.ph);
  return `<div class="pv"><div class="pv-page" style="width:${L.pw * u}px;height:${L.ph * u}px"><div class="pv-chart" style="width:${L.dw * u}px;height:${L.dh * u}px"></div></div>
    <div class="pv-t">${state.paperSize} ${L.o === 'landscape' ? '橫向' : '直向'}<small>四邊留 1 公分，其餘由圖表填滿</small></div></div>`;
}

function setK(k, v) {
  const p = k.split(':');

    const r = findRow(p[1]); if (!r) return;
    if (p[2] === 'f') r.fields[p[3]] = v; else r[p[2]] = v;
    if (p[2] === 'start' && (r.type !== 'bar' || toDay(r.end) < toDay(r.start))) r.end = r.start;
    return;
  }

function readVal(t) {

  if (t.dataset.k.includes(':f:') && t.tagName === 'SELECT') return Number(t.value);

}

function nextStart() {

  return last ? rowDates(last)[1] + 1 : toDay(state.start);
}
function defaultProject() {
  const cur = openRow && findRow(openRow);
  if (cur && cur.type !== 'section') return cur.project;
  const last = [...state.rows].reverse().find(r => r.type !== 'section');
  return last ? last.project : state.projects[0].id;
}

  const used = new Set(state.projects.map(p => p.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[state.projects.length % PALETTE.length];
  const p = { id: uid(), name: '新專案', color }; state.projects.push(p); return p;
}
function newRow(type, name) {
  const s = type === 'section' ? toDay(state.start) : nextStart();
  return { id: uid(), name, type, project: defaultProject(), start: toStr(s), end: toStr(type === 'bar' ? s + 6 : s), fields: Object.fromEntries(state.columns.map(c => [c.id, c.type === 'status' ? 0 : ''])) };
}
document.addEventListener('click', e => {
  // 關閉下拉選單

  if (!ctx.hidden) closeCtx();
  const b = e.target.closest('[data-act]');
  if (!b || chart.contains(b)) return;
  const S = state, id = b.dataset.id, act = b.dataset.act;
  const ri = S.rows.findIndex(r => r.id === id), ci = S.columns.findIndex(c => c.id === id);
  let focusName = null;
  switch (act) {
    case 'toggle': openRow = openRow === id ? null : id; renderSide(); return;
    case 'unit': {
      const AX = { day: 'DAY', week: 'WEEK', month: 'MONTH' };
      if (Object.values(AX).includes(S.axisLabel)) S.axisLabel = AX[b.dataset.v];
      S.unit = b.dataset.v; break;
    }
    case 'setType': {
      const r = S.rows[ri]; r.type = b.dataset.v;
      if (r.type === 'bar' && toDay(r.end) <= toDay(r.start)) r.end = toStr(toDay(r.start) + 6);
      if (r.type !== 'bar') r.end = r.start;
      break;
    }
    case 'addProj': { const p = newProject(); focusName = `[data-k="proj:${p.id}:name"]`; break; }
    case 'setProj': S.rows[ri].project = b.dataset.v; break;
    case 'setPaper': S.paperSize = b.dataset.v; break;
    case 'setOrient': S.orient = b.dataset.v; break;
    case 'setFormat': S.exportFormat = b.dataset.v; break;
    case 'setPreset': Object.assign(S, PRESETS[b.dataset.v].v); break;
    case 'setFont': S.fontScale = Number(b.dataset.v); break;
    case 'newProjFor': { const p = newProject(); S.rows[ri].project = p.id; focusName = `[data-k="proj:${p.id}:name"]`; break; }
    case 'projDel': {
      if (S.projects.length < 2) return;
      const pi = S.projects.findIndex(p => p.id === id), p = S.projects[pi];
      const n = S.rows.filter(r => r.project === id && r.type !== 'section').length;
      const fallback = S.projects[pi === 0 ? 1 : 0];
      if (n && !confirm(`刪除專案「${p.name}」？其中 ${n} 個任務會移到「${fallback.name}」。`)) return;
      S.rows.forEach(r => { if (r.project === id) r.project = fallback.id; });
      S.projects.splice(pi, 1); break;
    }
    case 'sortProj': {
      const order = Object.fromEntries(S.projects.map((p, i) => [p.id, i]));
      const slots = [], tasks = [];
      S.rows.forEach((r, i) => { if (r.type !== 'section') { slots.push(i); tasks.push(r); } });
      tasks.sort((a, b2) => order[a.project] - order[b2.project]);
      slots.forEach((slot, k) => S.rows[slot] = tasks[k]);
      break;
    }
    case 'addRow': case 'addPoint': case 'addSection': {
      const r = act === 'addRow' ? newRow('bar', '新任務') : act === 'addPoint' ? newRow('diamond', '活動當日') : newRow('section', '新分組');
      S.rows.push(r); openRow = r.id; focusName = `[data-k="row:${r.id}:name"]`; break;
    }
    case 'rowUp': if (ri > 0) [S.rows[ri - 1], S.rows[ri]] = [S.rows[ri], S.rows[ri - 1]]; break;
    case 'rowDown': if (ri < S.rows.length - 1) [S.rows[ri + 1], S.rows[ri]] = [S.rows[ri], S.rows[ri + 1]]; break;
    case 'rowDup': { const c = JSON.parse(JSON.stringify(S.rows[ri])); c.id = uid(); c.name += '（複本）'; S.rows.splice(ri + 1, 0, c); openRow = c.id; break; }
    case 'rowDel': S.rows.splice(ri, 1); if (openRow === id) openRow = null; break;
    case 'addCol': S.columns.push({ id: uid(), name: '新欄位', type: 'text', width: 110 }); break;
    case 'colUp': if (ci > 0) [S.columns[ci - 1], S.columns[ci]] = [S.columns[ci], S.columns[ci - 1]]; break;

  if (focusName) { const el = $(focusName); if (el) { el.scrollIntoView({ block: 'nearest' }); el.select(); } }
});

  const it = e.target.closest('.it'); if (!it || e.button !== 0) return;

  const tl = it.parentElement, W = tl.clientWidth;

  const [a, b] = rowDates(r);

// 只抓圖上用到的字，做成內嵌字型，避免下載整套中文字型
async function fontCSS(text) {
  const chars = [...new Set(text.replace(/\s/g, '') + '0123456789/–今天')].join('');
  let css = await (await fetch('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&text=' + encodeURIComponent(chars))).text();
  for (const u of new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))) {
    css = css.split(u).join(await blobToDataURL(await (await fetch(u)).blob()));
  }
  return css;
}
async function exportFile(btn) {
  const S = state, pdf = S.exportFormat === 'pdf', usePage = pdf;
  const fname = (S.title || '時程表').replace(/[\\/:*?"<>|]/g, '_');
  const label = btn.innerHTML;
  btn.disabled = true; btn.textContent = '產生中…';
  if (document.activeElement?.isContentEditable) document.activeElement.blur();
  hideTip(); closeCtx(); checkpoint();
  chart.classList.add('exporting'); chart.classList.toggle('no-today', !S.printToday);
  const restore = usePage ? applyStretch() : () => {};
  try {
    await Promise.all([loadScript(LIBS.h2i), pdf ? loadScript(LIBS.pdf) : null]);
    const w = chart.scrollWidth, h = chart.scrollHeight;
    const L = usePage ? pageLayout(w, h) : null;
    // 紙張版面約 300dpi；只有圖表時為畫面 3 倍；都不超過瀏覽器畫布上限
    const pr = Math.max(1, Math.min(usePage ? 4 : 3, usePage ? (L.dw / 25.4 * 300) / w : 3, 15000 / w, 15000 / h));
    let fontEmbedCSS;
    try { fontEmbedCSS = await fontCSS(chart.innerText); } catch { fontEmbedCSS = undefined; }
    const img = await window.htmlToImage.toCanvas(chart, { pixelRatio: pr, backgroundColor: '#ffffff', width: w, height: h, fontEmbedCSS, skipFonts: !fontEmbedCSS });
    if (pdf) {
      const doc = new window.jspdf.jsPDF({ orientation: L.o, unit: 'mm', format: S.paperSize.toLowerCase(), compress: true });
      doc.setProperties({ title: S.title || '時程表' });
      doc.addImage(img.toDataURL('image/png'), 'PNG', (L.pw - L.dw) / 2, (L.ph - L.dh) / 2, L.dw, L.dh, undefined, 'FAST');
      doc.save(`${fname}.pdf`);
    } else {
      const out = document.createElement('canvas'), g = out.getContext('2d');
      const m = Math.round(40 * pr); // 圖表原尺寸，四周加白邊
      out.width = img.width + 2 * m; out.height = img.height + 2 * m;
      g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
      g.drawImage(img, m, m);
      const blob = await new Promise(ok => out.toBlob(ok, 'image/jpeg', 0.95));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `${fname}.jpg`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    exp.close();
  } catch (err) {
    if (pdf && confirm(`PDF 產生失敗：${err.message}\n\n要改用瀏覽器列印視窗嗎？`)) { exp.close(); setTimeout(() => window.print(), 60); }
    else if (!pdf) alert(`JPG 產生失敗：${err.message}`);
  } finally {
    restore();
    chart.classList.remove('exporting', 'no-today');
    btn.disabled = false; btn.innerHTML = label;
  }
}
window.addEventListener('afterprint', () => {
  chart.style.zoom = ''; chart.classList.remove('exporting', 'no-today');
  if (printRestore) { printRestore(); printRestore = null; }
});

/* ================= 檢視縮放（只影響畫面，不影響匯出） ================= */
const mainEl = $('#main'), wrapEl = $('#wrap');
const ZKEY = 'timeschedule.zoom', ZMIN = 0.25, ZMAX = 3;
const ZSTEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
let viewZoom = 1;
try { viewZoom = Math.min(ZMAX, Math.max(ZMIN, parseFloat(localStorage.getItem(ZKEY)) || 1)); } catch {}
// 以畫面上某一點為中心縮放（預設為可視區中心）
function setZoom(z, cx, cy) {
  z = Math.min(ZMAX, Math.max(ZMIN, Math.round(z * 100) / 100));
  const mr = mainEl.getBoundingClientRect();
  if (cx == null) { cx = mr.left + mainEl.clientWidth / 2; cy = mr.top + mainEl.clientHeight / 2; }
  const wr = wrapEl.getBoundingClientRect();
  const px = (cx - wr.left) / viewZoom, py = (cy - wr.top) / viewZoom; // 縮放前，游標下的內容座標
  viewZoom = z;
  wrapEl.style.zoom = z === 1 ? '' : z;
  const nr = wrapEl.getBoundingClientRect();
  mainEl.scrollLeft += (nr.left + px * z) - cx;
  mainEl.scrollTop += (nr.top + py * z) - cy;
  $('.zv').textContent = Math.round(z * 100) + '%';
  try { localStorage.setItem(ZKEY, z); } catch {}
}
function stepZoom(dir) {
  const next = dir > 0 ? ZSTEPS.find(v => v > viewZoom + 0.001) : [...ZSTEPS].reverse().find(v => v < viewZoom - 0.001);
  if (next) setZoom(next);
}
function fitZoom() {
  const pad = 64, w = wrapEl.offsetWidth, h = wrapEl.offsetHeight;
  setZoom(Math.min((mainEl.clientWidth - pad) / w, (mainEl.clientHeight - pad) / h, ZMAX));
  mainEl.scrollTo({ left: 0, top: 0 });
}
$('#zoombar').addEventListener('click', e => {
  const b = e.target.closest('[data-zoom]'); if (!b) return;
  ({ in: () => stepZoom(1), out: () => stepZoom(-1), reset: () => setZoom(1), fit: fitZoom })[b.dataset.zoom]();
});
// Ctrl／⌘＋滾輪、觸控板雙指縮放
mainEl.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setZoom(viewZoom * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const t = e.target;
  if (t.isContentEditable || /INPUT|SELECT|TEXTAREA/.test(t.tagName)) return;
  if (e.key === '=' || e.key === '+') { e.preventDefault(); stepZoom(1); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); stepZoom(-1); }
  else if (e.key === '0') { e.preventDefault(); setZoom(1); }
});
setZoom(viewZoom);

/* ================= 使用導覽 ================= */
const TOUR_KEY = 'timeschedule.tourDone';
const CUR = '<svg class="cur" viewBox="0 0 16 16"><path d="M3 1.5l9.5 6.5-4.2.9 2.6 4.6-1.7.9-2.6-4.6L3 12.6z" fill="#fff" stroke="#1c1c1a" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const DEMOS = {
  colors: `<div class="demo d-color"><div class="lab">任務名稱</div><div class="bar"></div></div>`,
  reorder: `<div class="demo d-reo"><div class="r a" style="--c:#1c1c1a"><i></i>交稿與預錄回覆</div><div class="r b" style="--c:#5b9e9b"><i></i>人力補位與主管交接</div><div class="r c" style="--c:#1c1c1a"><i></i>餐飲與次會場確認</div>${CUR}</div>`,
  drag: `<div class="demo d-drag"><div class="grid"></div><div class="bar"></div>${CUR}</div>`,
  ctx: `<div class="demo d-ctx"><div class="lab">活動當日</div><div class="menu"><div style="--c:#1c1c1a"><i></i>活動執行</div><div style="--c:#5b9e9b"><i></i>行政財務</div><div class="hl" style="--c:#d9822b"><i></i>宣傳</div></div>${CUR}</div>`,
};
const TOUR = [
  { t: '歡迎使用時程表產生器', d: '花 30 秒看一下主要功能。導覽中不會改動你的資料，隨時可以略過。' },
  { sel: ['.top .seg', '.top .range'], t: '時間軸', d: '切換「日／週／月」顯示單位，旁邊設定整張時程表的起訖日期。' },
  { sel: ['.side .blk:nth-child(1)'], t: '專案與顏色', d: '每個專案一種顏色，任務標籤和橫條會一起變色。點色塊換顏色、點名稱改名，按 ＋ 新增專案。', demo: 'colors' },
  { sel: ['.side .blk:nth-child(2)'], t: '任務清單', d: '點一下任務展開，編輯名稱、日期、類型與負責人。按住任務上下拖曳，可以調整順序。', demo: 'reorder' },
  { sel: ['#chart .tl'], t: '直接在圖上拖曳', d: '拖曳橫條整段移動日期，拖橫條左右兩端改開始或結束日。標題、負責人這些文字點一下就能改。', demo: 'drag' },
  { sel: ['#chart .lab'], t: '右鍵選單', d: '在任務標籤或橫條上按右鍵，可以換顏色（專案）和類型：期間、單日、舉辦日、截止日。雙擊標籤可改名。', demo: 'ctx' },
  { sel: ['#zoombar'], t: '調整檢視大小', d: '右下角可以放大、縮小，或按「符合視窗」把整張圖放進畫面。也可以按住 Ctrl／⌘ 滾動滑鼠，或用觸控板雙指縮放。這只影響畫面，不影響匯出。' },
  { sel: ['[data-tb="settings"]'], t: '設定', d: '新增右側欄位（負責人、進度…）、調整列高列距、格線、圖例與時間軸主色。' },
  { sel: ['.top .menu', '[data-tb="pdf"]'], t: '存檔與匯出', d: '「匯出」可下載 PDF 或 JPG，並可切成「企劃書」（大字、可換行）或「只有圖表」版面。「檔案」可存成 JSON，帶到別台電腦或分享給別人。資料也會自動暫存在這個瀏覽器。' },
  { sel: ['[data-tb="tour"]'], t: '隨時再看一次', d: '之後點這個「?」就能重看這份導覽。開始排你的時程吧！' },
];
const tourEl = document.createElement('div');
tourEl.className = 'tour'; tourEl.hidden = true;
tourEl.innerHTML = '<div class="tour-block"></div><div class="tour-hole"></div><div class="tour-card" role="dialog" aria-live="polite"></div>';
document.body.appendChild(tourEl);
const tHole = $('.tour-hole', tourEl), tCard = $('.tour-card', tourEl);
let tourI = -1;
function startTour() {
  closeCtx(); if (dlg.open) dlg.close(); if (exp.open) exp.close();
  $$('details.menu[open]').forEach(d => d.open = false);
  tourI = 0; tourEl.hidden = false; showStep();
}
function endTour() {
  tourEl.hidden = true; tourI = -1;
  try { localStorage.setItem(TOUR_KEY, '1'); } catch {}
}
function showStep() {
  const st = TOUR[tourI], n = TOUR.length, last = tourI === n - 1;
  tCard.innerHTML = `<div class="tour-n">${tourI + 1} / ${n}</div><h3>${st.t}</h3><p>${st.d}</p>${st.demo ? DEMOS[st.demo] : ''}
    <div class="tour-f"><div class="tour-dots">${TOUR.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('')}</div>
      ${last ? '' : '<button class="btn sm" data-tour="skip">略過</button>'}
      ${tourI ? '<button class="btn sm" data-tour="prev">上一步</button>' : ''}
      <button class="btn sm primary" data-tour="next">${last ? '開始使用' : tourI ? '下一步' : '開始導覽'}</button></div>`;
  placeStep();
  $('[data-tour="next"]', tCard).focus();
}
function placeStep() {
  if (tourI < 0) return;
  const st = TOUR[tourI], els = (st.sel || []).map(q => $(q)).filter(Boolean);
  let r = null;
  if (els.length) {
    els[0].scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const rs = els.map(e => e.getBoundingClientRect()), P = 6;
    r = { l: Math.min(...rs.map(x => x.left)) - P, t: Math.min(...rs.map(x => x.top)) - P, r: Math.max(...rs.map(x => x.right)) + P, b: Math.max(...rs.map(x => x.bottom)) + P };
    // 只框住看得到的部分
    r.l = Math.max(r.l, 4); r.t = Math.max(r.t, 4); r.r = Math.min(r.r, innerWidth - 4); r.b = Math.min(r.b, innerHeight - 4);
  }
  if (r) Object.assign(tHole.style, { left: r.l + 'px', top: r.t + 'px', width: (r.r - r.l) + 'px', height: (r.b - r.t) + 'px' });
  else Object.assign(tHole.style, { left: innerWidth / 2 + 'px', top: innerHeight / 2 + 'px', width: '0px', height: '0px' });
  const cw = tCard.offsetWidth, ch = tCard.offsetHeight, G = 14, M = 12;
  const clampX = x => Math.max(M, Math.min(x, innerWidth - cw - M)), clampY = y => Math.max(M, Math.min(y, innerHeight - ch - M));
  let x, y;
  if (!r) { x = (innerWidth - cw) / 2; y = (innerHeight - ch) / 2; }
  else if (r.b + G + ch <= innerHeight - M) { x = clampX((r.l + r.r) / 2 - cw / 2); y = r.b + G; }
  else if (r.t - G - ch >= M) { x = clampX((r.l + r.r) / 2 - cw / 2); y = r.t - G - ch; }
  else if (r.r + G + cw <= innerWidth - M) { x = r.r + G; y = clampY(r.t); }
  else if (r.l - G - cw >= M) { x = r.l - G - cw; y = clampY(r.t); }
  else { x = (innerWidth - cw) / 2; y = innerHeight - ch - M; }
  tCard.style.left = x + 'px'; tCard.style.top = y + 'px';
}
tCard.addEventListener('click', e => {
  const b = e.target.closest('[data-tour]'); if (!b) return;
  const a = b.dataset.tour;
  if (a === 'skip') endTour();
  else if (a === 'prev') { tourI--; showStep(); }
  else if (tourI === TOUR.length - 1) endTour();
  else { tourI++; showStep(); }
});
document.addEventListener('keydown', e => {
  if (tourI < 0) return;
  if (e.key === 'Escape') { e.stopPropagation(); endTour(); }
  else if (e.key === 'ArrowRight') { if (tourI < TOUR.length - 1) { tourI++; showStep(); } else endTour(); }
  else if (e.key === 'ArrowLeft' && tourI > 0) { tourI--; showStep(); }
}, true);
window.addEventListener('resize', placeStep);
document.addEventListener('click', e => { if (e.target.closest('[data-tb="tour"]')) startTour(); });

renderAll();
let tourSeen = false;
try { tourSeen = !!localStorage.getItem(TOUR_KEY); } catch {}
if (!tourSeen) setTimeout(startTour, 500);
})();
</script>
