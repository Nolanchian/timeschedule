<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>時程表產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style id="page-style">@page{size:A4 landscape;margin:10mm}</style>
<style>
/* ================= 介面 tokens ================= */
:root{
  --bg:#f6f6f4; --surface:#fff; --subtle:#f2f2f0; --hover:#ececea; --border:#e8e8e5;
  --text:#1c1c1a; --muted:#8a8a85; --faint:#b8b8b3; --ink:#1c1c1a;
  --r:8px; --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:288px 1fr;grid-template-rows:56px 1fr;height:100vh}

/* 頂列 */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.doc-title{font-size:15px;font-weight:700;border:0;background:none;padding:6px 8px;border-radius:var(--r);width:220px;min-width:80px}
.doc-title:hover{background:var(--subtle)}
.doc-title:focus{outline:none;background:var(--subtle)}
.top .sp{flex:1}
.range{display:flex;align-items:center;gap:4px;color:var(--muted)}
.range input{width:132px}

/* 通用控制 */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:var(--r);background:none;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.ib{width:32px;padding:0;justify-content:center;color:var(--muted)}
.btn.ib:hover{color:var(--text)}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.ib.sm{width:28px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.danger:hover{color:#c0392b;background:#fbeceb}
.in{height:32px;width:100%;min-width:0;padding:0 10px;border:1px solid transparent;border-radius:var(--r);background:var(--subtle);transition:background .12s,border-color .12s}
.in:hover{background:var(--hover)}
.in:focus{outline:none;background:#fff;border-color:#d6d6d2}
select.in{padding-right:4px}
.bare{height:30px;width:100%;min-width:0;padding:0 6px;border:0;border-radius:6px;background:none}
.bare:hover{background:var(--subtle)}
.bare:focus{outline:none;background:var(--subtle)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r);background:var(--subtle)}
.seg button{height:26px;min-width:36px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:#dcdcd8;position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(14px)}

/* 下拉選單 */
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:38px;z-index:30;min-width:168px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.pop button{display:flex;width:100%;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left}
.pop button:hover{background:var(--subtle)}

/* 側欄 */
.side{background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:12px 10px 24px}
.blk+.blk{margin-top:20px}
.blk-h{display:flex;align-items:center;gap:4px;padding:0 4px 0 8px;height:32px}
.blk-h h3{margin:0;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;flex:1}
.blk-h .n{font-size:12px;color:var(--faint);margin-right:2px}
.plist,.tlist{list-style:none;margin:0;padding:0}
.pitem{display:flex;align-items:center;gap:4px;height:34px;padding:0 4px 0 8px;border-radius:var(--r)}
.pitem:hover{background:var(--subtle)}
.pitem .cnt{font-size:12px;color:var(--faint);min-width:18px;text-align:right}
.pitem .btn{opacity:0}
.pitem:hover .btn,.pitem:focus-within .btn{opacity:1}
.pdot{position:relative;width:14px;height:14px;border-radius:4px;background:var(--c);flex:none;cursor:pointer;margin-right:2px}
.pdot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.titem{border-radius:var(--r)}
.titem.open{background:var(--subtle);margin:4px 0}
.trow{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;background:none;border-radius:var(--r);text-align:left}
.titem:not(.open) .trow:hover{background:var(--subtle)}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.titem.sec .tname{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.04em}
.glyph{width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center}
.glyph::before{content:"";background:var(--c)}
.glyph.bar::before{width:14px;height:6px;border-radius:2px}
.glyph.dot::before{width:8px;height:8px;border-radius:50%}
.glyph.diamond::before{width:8px;height:8px;transform:rotate(45deg)}
.glyph.flag::before{width:10px;height:8px;clip-path:polygon(0 0,100% 0,50% 100%)}
.glyph.section::before{width:12px;height:2px;background:var(--faint);box-shadow:0 4px 0 var(--faint)}
.tdetail{padding:4px 10px 10px;display:grid;gap:10px}
.tdetail .in{background:#fff}
.tdetail .in:hover{background:#fff;border-color:var(--border)}
.f{display:grid;gap:4px}
.f>span{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tdetail .seg{background:#fff;display:grid}
.tdetail .seg button{min-width:0;padding:0}
.tdetail .seg button.on{background:var(--subtle);box-shadow:none}
.tfoot{display:flex;gap:2px;justify-content:flex-end;margin-top:2px}
.addbar{display:flex;gap:2px;padding:4px 0 0}
.addbar .btn{color:var(--muted)}
.addbar .btn:hover{color:var(--text)}

/* 設定視窗 */
dialog.set{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 64px);padding:0;border:0;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.18);color:var(--text)}
dialog.set::backdrop{background:rgba(20,20,18,.28)}
.set-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;padding:16px 16px 12px 24px;background:#fff}
.set-h h2{margin:0;font-size:16px;flex:1}
.set-b{padding:0 24px 24px}
.set-b h4{margin:20px 0 6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.set-b h4:first-child{margin-top:4px}
.fr{display:grid;grid-template-columns:1fr 200px;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid var(--subtle)}
.fr>span{font-size:13px}
.fr>span small{display:block;color:var(--muted);font-size:12px}
.fr .ctl{display:flex;justify-content:flex-end}
.fr input[type=color]{width:48px;height:28px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer}
.colrow{display:grid;grid-template-columns:1fr 120px 64px auto;gap:6px;align-items:center;padding:4px 0}

/* 畫布 */
.main{overflow:auto;position:relative}
.stage{padding:32px;min-width:min-content}
.chart-wrap{display:inline-block;background:#fff;padding:40px 40px 44px;border-radius:12px;border:1px solid var(--border)}

/* ================= 時程表本體 ================= */
.chart{--primary:#5b9e9b;--head:#f2f2f0;--line:#d4d4d0;font-family:var(--font);color:#222}
.chart [contenteditable]{outline:none;cursor:text;border-radius:2px}
.chart [contenteditable]:hover{box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.chart [contenteditable]:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 50%,transparent)}
.c-title{font-size:24px;font-weight:700;margin:0 0 14px;display:inline-block;min-width:4em}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 24px;font-size:14px;color:#444}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:2px;background:var(--c)}
.c-grid{display:grid;column-gap:12px}
.c-head{row-gap:8px;margin-bottom:18px}
.groups,.units{display:flex}
.g{padding:0 2px;height:46px}
.g span{display:flex;align-items:center;justify-content:center;height:100%;background:var(--head);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden}
.u{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary);font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden}
.u small{font-size:10px;opacity:.8}
.u.we{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.axis{display:flex}
.axis-box{flex:1;height:42px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primary);font-size:15px;letter-spacing:.06em}
.xh{display:flex;align-items:center;height:42px;font-size:15px;color:#555;white-space:nowrap}
.xh.c{justify-content:center}
.lab{min-width:0;cursor:grab;user-select:none;-webkit-user-select:none}
.lab-box[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text}
.lab.dragging-src{opacity:.35}
.lab-box{height:100%;background:var(--pc);color:var(--pt);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;padding:0 10px;overflow:hidden;white-space:nowrap}
.lab.sec .lab-box{background:none;color:#333;justify-content:flex-start;padding:0 2px;border-bottom:2px solid #333;font-size:16px}
.xc{display:flex;align-items:center;font-size:15px;white-space:nowrap;overflow:hidden;min-width:0}
.xc.c{justify-content:center}
.xc.st{cursor:pointer;color:var(--pc)}
.xc.dt{color:#555;font-variant-numeric:tabular-nums}
.tl{position:relative;margin:-8px 0;background:#fff}
.tl::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;z-index:2}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed #e4e4e1;z-index:1}
.gl.g2{border-left:1px solid var(--line)}
.shade{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--primary) 6%,transparent)}
.band{position:absolute;left:0;right:0;background:var(--head)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid #e4572e;z-index:4;pointer-events:none}
.today span{position:absolute;bottom:-22px;left:-14px;font-size:11px;color:#e4572e;white-space:nowrap}
.it{position:absolute;z-index:3;cursor:grab;touch-action:none}
.it:active{cursor:grabbing}
.it.bar{background:var(--c)}
.it.bar .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}
.it.bar .h.l{left:-5px}.it.bar .h.r{right:-5px}
.it.bar .bt{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ct);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.it.pt{transform:translate(-50%,-50%);background:var(--c)}
.it.dot{width:16px;height:16px;border-radius:50%}
.it.diamond{width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg)}
.it.flag{width:20px;height:18px;clip-path:polygon(0 0,100% 0,50% 100%)}
.it.dragging{opacity:.85}
.empty{padding:48px;color:#999;text-align:center;border:1px dashed var(--line)}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;display:none}

/* 拖曳排序與右鍵選單 */
.dropline{position:fixed;height:2px;background:var(--ink);border-radius:1px;z-index:60;pointer-events:none;display:none}
.dropline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
body.reordering,body.reordering *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.titem.dragging-src{opacity:.35}
.ctx{position:fixed;top:0;left:0;right:auto;min-width:210px;max-height:calc(100vh - 16px);overflow:auto}
.ctx .ch{padding:6px 10px 4px;font-size:12px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .ch.t{color:var(--text);font-weight:700;font-size:13px}
.ctx hr{border:0;border-top:1px solid var(--subtle);margin:4px 0}
.ctx .sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.ctx .ck{margin-left:auto;padding-left:12px;font-size:12px}
.ctx .glyph{margin:0 1px}
.ctx button.danger:hover{color:#c0392b;background:#fbeceb}
.pop button:disabled{opacity:.35;pointer-events:none}
.side-hint{padding:14px 8px 0;font-size:12px;color:var(--faint);line-height:1.7}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto}
  .top{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .top .sp{display:none}
  .side{max-height:45vh;border-right:0;border-bottom:1px solid var(--border)}
  .stage{padding:16px}
}

@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto;background:#fff}
  .top,.side,.tip,dialog,.ctx,.dropline{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible}
  .stage{padding:0}
  .chart-wrap{border:0;padding:0;border-radius:0}
  .it .h{display:none}
  .chart [contenteditable]:hover,.chart [contenteditable]:focus{box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <aside class="side" id="side"></aside>
  <main class="main"><div class="stage"><div class="chart-wrap"><div class="chart" id="chart"></div></div></div></main>
</div>
<dialog class="set" id="set"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<div class="pop ctx" id="ctx" hidden></div>
<div class="dropline" id="dropline"></div>
<div class="tip" id="tip"></div>

<script>
(() => {
'use strict';
/* ================= 工具函式 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const DAY = 86400000;
const toDay = s => { const [y, m, d] = String(s).split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const toStr = n => new Date(n * DAY).toISOString().slice(0, 10);
const ymd = n => { const d = new Date(n * DAY); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), d.getUTCDay()]; };
const mStart = (y, m) => Math.round(Date.UTC(y, m - 1, 1) / DAY);
const mEnd = (y, m) => Math.round(Date.UTC(y, m, 0) / DAY);
const md = n => { const [, m, d] = ymd(n); return `${m}/${d}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const isHex = s => /^#[0-9a-f]{6}$/i.test(s || '');
const todayDay = () => { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY); };
// 依底色亮度決定文字用深或白
const inkOn = hex => { const n = parseInt(hex.slice(1), 16); const L = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; return L > 0.62 ? '#1c1c1a' : '#ffffff'; };

const ICONS = {
  plus: 'M8 3.5v9M3.5 8h9',
  undo: 'M6 3.5 3 6.5l3 3M3 6.5h6.5a3.5 3.5 0 0 1 0 7H8',
  redo: 'M10 3.5l3 3-3 3M13 6.5H6.5a3.5 3.5 0 0 0 0 7H8',
  sliders: 'M2.5 5h11M2.5 11h11M6 3.5v3M10 9.5v3',
  chev: 'M4.5 6.5 8 10l3.5-3.5',
  print: 'M8 2.5v8m-3.2-3.2L8 10.5l3.2-3.2M3 13.5h10',
  up: 'M8 12.5v-9M4.5 7 8 3.5 11.5 7',
  down: 'M8 3.5v9M4.5 9 8 12.5 11.5 9',
  copy: 'M5.5 5.5h7v7h-7zM3.5 10.5v-7h7',
  trash: 'M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5',
  x: 'M4 4l8 8M12 4l-8 8',
  sort: 'M3 4h10M3 8h7M3 12h4',
  file: 'M4 2.5h5l3 3v8H4zM9 2.5v3h3',
  open: 'M2.5 4.5h4l1.5 1.5h5.5v7h-11z',
  save: 'M8 2.5v7m-3-3 3 3 3-3M3 13.5h10',
  newdoc: 'M4 2.5h5l3 3v8H4zM8 7v4M6 9h4',
};
const ic = n => `<svg class="i" viewBox="0 0 16 16"><path d="${ICONS[n]}"/></svg>`;

const TYPES = { bar: '期間', dot: '單日', diamond: '舉辦日', flag: '截止日', section: '分組標題' };
const COLTYPES = { text: '文字', status: '進度圓餅', dates: '日期（自動）' };
const PALETTE = ['#5b9e9b', '#2f5d8a', '#d9822b', '#4f8a4b', '#c44569', '#7a5ea8', '#1c1c1a', '#b0884f'];
const PAPERS = { A4L: { label: 'A4 橫向', css: 'A4 landscape', w: 1047, h: 718 }, A3L: { label: 'A3 橫向', css: 'A3 landscape', w: 1512, h: 1047 }, A4P: { label: 'A4 直向', css: 'A4 portrait', w: 718, h: 1047 } };

function defaultState() {
  const c1 = uid(), c2 = uid(), p1 = uid(), p2 = uid();
  const r = (name, project, type, s, e, owner, st) => ({ id: uid(), name, type, project, start: s, end: e, fields: { [c1]: owner, [c2]: st } });
  return {
    version: 2,
    title: '年會籌備時程', showTitle: true, showLegend: true,
    unit: 'week', weekMode: 'month4', weekLabel: 'index', showWeekday: true,
    start: '2026-11-01', end: '2026-12-31',
    axisLabel: 'WEEK',
    colWidth: { day: 30, week: 104, month: 120 },
    labelWidth: 230, rowHeight: 36, rowGap: 12,
    theme: { primary: '#5b9e9b', head: '#f2f2f0' },
    showToday: true, gridLines: 'group', shadeWeekend: true, barText: false,
    paper: 'A4L', fitPage: true,
    projects: [{ id: p1, name: '活動執行', color: '#1c1c1a' }, { id: p2, name: '行政財務', color: '#5b9e9b' }],
    columns: [{ id: c1, name: '負責人', type: 'text', width: 130 }, { id: c2, name: '狀態', type: 'status', width: 70 }],
    rows: [
      r('交稿與預錄回覆', p1, 'bar', '2026-11-15', '2026-11-19', '議程窗口', 25),
      r('議程與宣傳發布', p1, 'bar', '2026-11-15', '2026-11-21', '美術 / 社群', 25),
      r('人力補位與主管交接', p2, 'bar', '2026-11-15', '2026-11-22', '林瀚', 0),
      r('餐飲與次會場確認', p1, 'bar', '2026-11-15', '2026-11-22', '餐飲 / 場務', 0),
      r('預算分攤與憑證', p2, 'bar', '2026-11-15', '2026-11-24', '財務長', 0),
      r('影片與簡報試播', p1, 'bar', '2026-11-22', '2026-12-03', '林世均', 0),

function normalize(s) {
  const d = defaultState();
  const o = Object.assign({}, d, s);
  o.version = 2;
  o.theme = { primary: isHex(s.theme?.primary) ? s.theme.primary : d.theme.primary, head: isHex(s.theme?.head) ? s.theme.head : d.theme.head };
  o.colWidth = Object.assign({}, d.colWidth, s.colWidth);
  // v1 沒有專案：建立一個專案承接全部任務
  let projects = Array.isArray(s.projects) ? s.projects : null;
  if (!projects || !projects.length) projects = [{ id: uid(), name: '專案 1', color: isHex(s.theme?.label) ? s.theme.label : '#1c1c1a' }];
  o.projects = projects.map((p, i) => ({ id: p.id || uid(), name: p.name ?? `專案 ${i + 1}`, color: isHex(p.color) ? p.color : PALETTE[i % PALETTE.length] }));
  const pids = new Set(o.projects.map(p => p.id));
  o.columns = (Array.isArray(s.columns) ? s.columns : d.columns).map(c => ({ id: c.id || uid(), name: c.name ?? '', type: COLTYPES[c.type] ? c.type : 'text', width: +c.width || 110 }));
  o.rows = (Array.isArray(s.rows) ? s.rows : []).map(r => {
    const start = isDate(r.start) ? r.start : o.start;
    return { id: r.id || uid(), name: r.name ?? '', type: TYPES[r.type] ? r.type : 'bar', project: pids.has(r.project) ? r.project : o.projects[0].id, start, end: isDate(r.end) ? r.end : start, fields: r.fields || {} };
  });
  if (!isDate(o.start)) o.start = d.start;

}

}

function undo() { checkpoint(); if (!undoStack.length) return; redoStack.push(lastSnap); lastSnap = undoStack.pop(); restore(lastSnap); }
function redo() { if (!redoStack.length) return; undoStack.push(lastSnap); lastSnap = redoStack.pop(); restore(lastSnap); }

/* ================= 時間軸計算 ================= */
let COLS = [];
function buildCols(S) {
  let s = toDay(S.start), e = toDay(S.end);
  if (e < s) [s, e] = [e, s];
  const cols = [];
  const [sy, sm] = ymd(s), [ey, em] = ymd(e);
  const multiYear = sy !== ey;
  const mLabel = (y, m) => multiYear ? `${y}年${m}月` : `${m}月`;
  const WD = '日一二三四五六';
  const months = fn => { for (let y = sy, m = sm; y * 12 + m <= ey * 12 + em; m === 12 ? (y++, m = 1) : m++) fn(y, m); };
  if (S.unit === 'day') {
    for (let d = s; d <= e; d++) {
      const [y, m, dd, wd] = ymd(d);
      cols.push({ s: d, e: d, label: String(dd), sub: S.showWeekday ? WD[wd] : '', group: mLabel(y, m), gk: y * 12 + m, weekend: wd === 0 || wd === 6 });
    }
  } else if (S.unit === 'month') {
    months((y, m) => cols.push({ s: mStart(y, m), e: mEnd(y, m), label: `${m}月`, group: `${y}年`, gk: y }));
  } else if (S.weekMode === 'iso') {
    const gMin = sy * 12 + sm, gMax = ey * 12 + em;
    let lastGk = null, idx = 0;
    for (let d = s - ((ymd(s)[3] + 6) % 7); d <= e; d += 7) {
      // 一週歸屬於週四所在月份，但不超出範圍首尾月份
      const [ty, tm] = ymd(d + 3), [, m, dd] = ymd(d);
      const gk = Math.min(Math.max(ty * 12 + tm, gMin), gMax);
      const gy = Math.floor((gk - 1) / 12), gm = gk - gy * 12;
      idx = gk === lastGk ? idx + 1 : 1; lastGk = gk;
      cols.push({ s: d, e: d + 6, label: S.weekLabel === 'date' ? `${m}/${dd}` : String(idx), group: mLabel(gy, gm), gk });
    }
  } else {
    months((y, m) => {
      const ms = mStart(y, m), me = mEnd(y, m);
      for (let k = 0; k < 4; k++) {
        const ws = ms + 7 * k, we = k < 3 ? ws + 6 : me;
        cols.push({ s: ws, e: we, label: S.weekLabel === 'date' ? `${m}/${1 + 7 * k}` : String(k + 1), group: mLabel(y, m), gk: y * 12 + m });
      }
    });
  }
  const groups = [];
  cols.forEach((c, i) => {
    const g = groups[groups.length - 1];
    if (g && g.gk === c.gk) g.count++; else groups.push({ gk: c.gk, label: c.group, count: 1, first: i });
  });
  return { cols, groups };
}
function colIndex(d) {
  let lo = 0, hi = COLS.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (COLS[mid].e < d) lo = mid + 1; else hi = mid; }
  return lo;
}
function fracOf(d, mode) {
  const N = COLS.length; if (!N) return 0;
  if (d < COLS[0].s) return 0;
  if (d > COLS[N - 1].e) return 1;
  const i = colIndex(d), c = COLS[i], len = c.e - c.s + 1;
  return (i + (d - c.s + (mode === 'start' ? 0 : mode === 'end' ? 1 : 0.5)) / len) / N;
}
function fracToDay(f) {
  const N = COLS.length;
  const x = Math.min(Math.max(f, 0), 0.999999) * N, i = Math.floor(x), c = COLS[i];
  return c.s + Math.floor((x - i) * (c.e - c.s + 1));
}
function rowDates(r) {
  let a = toDay(r.start), b = toDay(r.end || r.start);
  if (r.type !== 'bar') b = a;
  if (b < a) [a, b] = [b, a];
  return [a, b];
}
function datesText(r) {
  if (r.type === 'section') return '';
  const [a, b] = rowDates(r);
  return a === b ? md(a) : `${md(a)}–${md(b)}`;
}

/* ================= 圖表渲染 ================= */
const chart = $('#chart');
function pie(p) {
  p = +p || 0; const r = 9.5, c = 12;

  if (p >= 100) fill = `<circle cx="${c}" cy="${c}" r="${r}" fill="currentColor"/>`;
  else if (p > 0) {
    const a = p / 100 * 2 * Math.PI, x = c + r * Math.sin(a), y = c - r * Math.cos(a);
    fill = `<path d="M${c} ${c}L${c} ${c - r}A${r} ${r} 0 ${p > 50 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="currentColor"/>`;
  }
  return `<svg width="24" height="24" viewBox="0 0 24 24" aria-label="${p}%">${fill}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
}

function renderAll() { renderTop(); renderSide(); renderChart(); if (dlg.open) renderSettings(); }

/* ================= 編輯事件（頂列、側欄、設定共用） ================= */
function setK(k, v) {
  const p = k.split(':');
  if (p[0] === 'row') {
    const r = findRow(p[1]); if (!r) return;
    if (p[2] === 'f') r.fields[p[3]] = v; else r[p[2]] = v;
    if (p[2] === 'start' && (r.type !== 'bar' || toDay(r.end) < toDay(r.start))) r.end = r.start;
    return;
  }
  if (p[0] === 'col') { const c = findCol(p[1]); if (c) c[p[2]] = v; return; }
  if (p[0] === 'proj') { const pr = state.projects.find(x => x.id === p[1]); if (pr) pr[p[2]] = v; return; }
  const path = k.split('.'); let o = state;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = v;
}
function readVal(t) {
  if (t.type === 'checkbox') return t.checked;
  if (t.type === 'number') { if (t.value === '') return undefined; const n = Number(t.value); return isFinite(n) ? Math.max(+t.min, Math.min(+t.max, n)) : undefined; }
  if (t.type === 'date') return isDate(t.value) ? t.value : undefined;
  if (t.dataset.k.includes(':f:') && t.tagName === 'SELECT') return Number(t.value);
  return t.value;
}
const isUI = t => t.dataset && t.dataset.k && !chart.contains(t);
document.addEventListener('input', e => {
  const t = e.target; if (!isUI(t)) return;
  const v = readVal(t); if (v === undefined) return;
  setK(t.dataset.k, v);
  if (t.type === 'checkbox' || t.tagName === 'SELECT') return; // 交給 change
  save(); renderChart();
  const k = t.dataset.k;
  if (k.startsWith('row:')) refreshRowSummary(k.split(':')[1]);
  if (k === 'title') $$('[data-k="title"]').forEach(x => x !== t && (x.value = v));
  if (k.startsWith('proj:') && k.endsWith(':color')) { // 不重繪側欄，避免關掉調色盤
    const id = k.split(':')[1];
    t.parentElement.style.setProperty('--c', v);
    state.rows.forEach(r => { if (r.project === id) $$(`[data-card="${r.id}"] .glyph`, side).forEach(g => g.style.setProperty('--c', v)); });
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!isUI(t)) return;
  const v = readVal(t);
  if (v !== undefined) setK(t.dataset.k, v);
  checkpoint();
  renderChart();
  const k = t.dataset.k;
  if (t.dataset.re || k.startsWith('proj:') || k === 'start' || k === 'end') renderSide();
  if (t.dataset.re && dlg.open) renderSettings();
  if (k.startsWith('row:')) refreshRowSummary(k.split(':')[1]);
});

function nextStart() {
  const last = [...state.rows].reverse().find(r => r.type !== 'section');
  return last ? rowDates(last)[1] + 1 : toDay(state.start);
}
function defaultProject() {
  const cur = openRow && findRow(openRow);
  if (cur && cur.type !== 'section') return cur.project;
  const last = [...state.rows].reverse().find(r => r.type !== 'section');
  return last ? last.project : state.projects[0].id;
}
function newProject() {
  const used = new Set(state.projects.map(p => p.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[state.projects.length % PALETTE.length];
  const p = { id: uid(), name: '新專案', color }; state.projects.push(p); return p;
}
function newRow(type, name) {
  const s = type === 'section' ? toDay(state.start) : nextStart();
  return { id: uid(), name, type, project: defaultProject(), start: toStr(s), end: toStr(type === 'bar' ? s + 6 : s), fields: Object.fromEntries(state.columns.map(c => [c.id, c.type === 'status' ? 0 : ''])) };
}
document.addEventListener('click', e => {
  // 關閉下拉選單
  $$('details.menu[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
  if (!ctx.hidden) closeCtx();
  const b = e.target.closest('[data-act]');
  if (!b || chart.contains(b)) return;
  const S = state, id = b.dataset.id, act = b.dataset.act;
  const ri = S.rows.findIndex(r => r.id === id), ci = S.columns.findIndex(c => c.id === id);
  let focusName = null;
  switch (act) {
    case 'toggle': openRow = openRow === id ? null : id; renderSide(); return;
    case 'unit': {
      const AX = { day: 'DAY', week: 'WEEK', month: 'MONTH' };
      if (Object.values(AX).includes(S.axisLabel)) S.axisLabel = AX[b.dataset.v];
      S.unit = b.dataset.v; break;
    }
    case 'setType': {
      const r = S.rows[ri]; r.type = b.dataset.v;
      if (r.type === 'bar' && toDay(r.end) <= toDay(r.start)) r.end = toStr(toDay(r.start) + 6);
      if (r.type !== 'bar') r.end = r.start;
      break;
    }
    case 'addProj': { const p = newProject(); focusName = `[data-k="proj:${p.id}:name"]`; break; }
    case 'setProj': S.rows[ri].project = b.dataset.v; break;
    case 'newProjFor': { const p = newProject(); S.rows[ri].project = p.id; focusName = `[data-k="proj:${p.id}:name"]`; break; }
    case 'projDel': {
      if (S.projects.length < 2) return;
      const pi = S.projects.findIndex(p => p.id === id), p = S.projects[pi];
      const n = S.rows.filter(r => r.project === id && r.type !== 'section').length;
      const fallback = S.projects[pi === 0 ? 1 : 0];
      if (n && !confirm(`刪除專案「${p.name}」？其中 ${n} 個任務會移到「${fallback.name}」。`)) return;
      S.rows.forEach(r => { if (r.project === id) r.project = fallback.id; });
      S.projects.splice(pi, 1); break;
    }
    case 'sortProj': {
      const order = Object.fromEntries(S.projects.map((p, i) => [p.id, i]));
      const slots = [], tasks = [];
      S.rows.forEach((r, i) => { if (r.type !== 'section') { slots.push(i); tasks.push(r); } });
      tasks.sort((a, b2) => order[a.project] - order[b2.project]);
      slots.forEach((slot, k) => S.rows[slot] = tasks[k]);
      break;
    }
    case 'addRow': case 'addPoint': case 'addSection': {
      const r = act === 'addRow' ? newRow('bar', '新任務') : act === 'addPoint' ? newRow('diamond', '活動當日') : newRow('section', '新分組');
      S.rows.push(r); openRow = r.id; focusName = `[data-k="row:${r.id}:name"]`; break;
    }
    case 'rowUp': if (ri > 0) [S.rows[ri - 1], S.rows[ri]] = [S.rows[ri], S.rows[ri - 1]]; break;
    case 'rowDown': if (ri < S.rows.length - 1) [S.rows[ri + 1], S.rows[ri]] = [S.rows[ri], S.rows[ri + 1]]; break;
    case 'rowDup': { const c = JSON.parse(JSON.stringify(S.rows[ri])); c.id = uid(); c.name += '（複本）'; S.rows.splice(ri + 1, 0, c); openRow = c.id; break; }
    case 'rowDel': S.rows.splice(ri, 1); if (openRow === id) openRow = null; break;
    case 'addCol': S.columns.push({ id: uid(), name: '新欄位', type: 'text', width: 110 }); break;
    case 'colUp': if (ci > 0) [S.columns[ci - 1], S.columns[ci]] = [S.columns[ci], S.columns[ci - 1]]; break;
    case 'colDel': {
      const c = S.columns[ci];
      if (!confirm(`刪除欄位「${c.name}」？所有任務在此欄的內容也會刪除。`)) return;
      S.columns.splice(ci, 1); S.rows.forEach(r => delete r.fields[c.id]); break;
    }
    default: return;
  }
  checkpoint(); renderAll();
  if (focusName) { const el = $(focusName); if (el) { el.scrollIntoView({ block: 'nearest' }); el.select(); } }
});

/* ================= 圖表上的直接操作 ================= */

chart.addEventListener('keydown', e => {

  const t = e.target; if (!t.isContentEditable) return;

chart.addEventListener('dblclick', e => {

const tip = $('#tip');
const showTip = (text, x, y) => { tip.textContent = text; tip.style.display = 'block'; tip.style.left = (x + 14) + 'px'; tip.style.top = (y + 14) + 'px'; };
const hideTip = () => { tip.style.display = 'none'; };
let drag = null;
chart.addEventListener('pointermove', e => {
  if (drag) return;
  const it = e.target.closest('.it');
  if (it) showTip(it.dataset.tip, e.clientX, e.clientY); else hideTip();
});
chart.addEventListener('pointerleave', () => { if (!drag) hideTip(); });
chart.addEventListener('pointerdown', e => {
  const it = e.target.closest('.it'); if (!it || e.button !== 0) return;
  e.preventDefault();
  const r = findRow(it.dataset.row); if (!r) return;
  const tl = it.parentElement, W = tl.clientWidth;
  const fx = x => (x - tl.getBoundingClientRect().left) / W;
  const mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm';
  const [a, b] = rowDates(r);
  drag = { it, r, W, fx, mode, grab: fracToDay(fx(e.clientX)), a, b, na: a, nb: b, moved: false };
  it.setPointerCapture(e.pointerId);
  it.classList.add('dragging');
});
chart.addEventListener('pointermove', e => {
  if (!drag) return;
  const d = fracToDay(drag.fx(e.clientX)) - drag.grab;
  let na = drag.a, nb = drag.b;
  if (drag.mode === 'm') { na += d; nb += d; }
  else if (drag.mode === 'l') na = Math.min(drag.a + d, drag.b);
  else nb = Math.max(drag.b + d, drag.a);
  if (na !== drag.na || nb !== drag.nb) {
    drag.na = na; drag.nb = nb; drag.moved = true;
    if (drag.r.type === 'bar') {
      const x1 = fracOf(na, 'start') * drag.W, x2 = fracOf(nb, 'end') * drag.W;
      drag.it.style.left = x1 + 'px'; drag.it.style.width = Math.max(x2 - x1, 3) + 'px';
    } else drag.it.style.left = fracOf(na, 'mid') * drag.W + 'px';
  }
  showTip(na === nb ? md(na) : `${md(na)}–${md(nb)}`, e.clientX, e.clientY);
});
function endDrag() {
  if (!drag) return;
  const { r, na, nb, moved, it } = drag;
  it.classList.remove('dragging'); drag = null; hideTip();
  if (!moved) { openTask(r.id); return; }
  r.start = toStr(na); r.end = toStr(nb);
  checkpoint(); renderChart();
  if (openRow === r.id) renderSide(); else refreshRowSummary(r.id);
}
chart.addEventListener('pointerup', endDrag);
chart.addEventListener('pointercancel', endDrag);

/* ================= 拖曳排序（圖上標籤、側欄任務） ================= */
const dropline = $('#dropline');
let reo = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const lab = e.target.closest('#chart .lab'), trow = e.target.closest('#side .trow');
  if (lab && !e.target.isContentEditable) reo = { id: lab.dataset.open, src: 'chart', el: lab, y0: e.clientY, active: false };
  else if (trow) reo = { id: trow.dataset.id, src: 'side', el: trow.parentElement, y0: e.clientY, active: false };
});
document.addEventListener('pointermove', e => {
  if (!reo) return;
  if (!reo.active) {
    if (Math.abs(e.clientY - reo.y0) < 5) return;
    reo.active = true; closeCtx();
    document.body.classList.add('reordering'); reo.el.classList.add('dragging-src');
    getSelection().removeAllRanges();
  }
  e.preventDefault();
  const chartSrc = reo.src === 'chart';
  const els = chartSrc ? $$('.lab', chart) : $$('.titem', side);
  let idx = els.length;
  for (let i = 0; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { idx = i; break; } }
  reo.to = idx;
  const g = chartSrc ? state.rowGap / 2 : 2;
  const y = idx < els.length ? els[idx].getBoundingClientRect().top - g : els[els.length - 1].getBoundingClientRect().bottom + g;
  const box = chartSrc ? els[0].getBoundingClientRect() : $('.tlist', side).getBoundingClientRect();
  const right = chartSrc ? ($('.tl', chart)?.getBoundingClientRect().right ?? box.right) : box.right;
  dropline.style.cssText = `display:block;top:${y - 1}px;left:${box.left}px;width:${right - box.left}px`;
  // 側欄靠近上下緣時自動捲動
  if (!chartSrc) { const sr = side.getBoundingClientRect(); if (e.clientY < sr.top + 40) side.scrollTop -= 8; else if (e.clientY > sr.bottom - 40) side.scrollTop += 8; }
});
function endReorder(commit) {
  if (!reo) return;
  const r = reo; reo = null;
  if (!r.active) return;
  document.body.classList.remove('reordering'); dropline.style.display = 'none'; r.el.classList.remove('dragging-src');
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (!commit) return;
  const from = state.rows.findIndex(x => x.id === r.id);
  let to = r.to ?? from; if (to > from) to--;
  if (from < 0 || to === from) return;
  const [row] = state.rows.splice(from, 1); state.rows.splice(to, 0, row);
  checkpoint(); renderAll();
}
document.addEventListener('pointerup', () => endReorder(true));
document.addEventListener('pointercancel', () => endReorder(false));
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/* ================= 右鍵選單 ================= */

function openCtx(id, x, y) {

/* ================= 檔案與列印 ================= */
const fileInput = $('#file');

document.addEventListener('click', e => {

  switch (b.dataset.tb) {

      const d = defaultState(), [y, m] = ymd(todayDay());
      d.title = '未命名時程表'; d.rows = []; d.projects = [{ id: uid(), name: '專案 1', color: '#1c1c1a' }];
      d.start = toStr(mStart(y, m)); d.end = toStr(mEnd(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1));
      state = d; openRow = null; checkpoint(); renderAll(); break;
    }
    case 'open': fileInput.click(); break;
    case 'save': checkpoint(); download(`${(state.title || '時程表').replace(/[\\/:*?"<>|]/g, '_')}.json`, JSON.stringify(state, null, 2)); break;
    case 'pdf': checkpoint(); window.print(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'settings': renderSettings(); dlg.showModal(); break;
    case 'closeSet': dlg.close(); break;
  }
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.rows)) throw new Error('格式不符');
    checkpoint(); state = normalize(data); openRow = null; checkpoint(); renderAll();
  } catch (err) { alert('無法讀取這個檔案：' + err.message); }
  fileInput.value = '';
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.isContentEditable || /INPUT|SELECT|TEXTAREA/.test(t.tagName)) return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.metaKey || e.ctrlKey) && k === 'y') { e.preventDefault(); redo(); }
});
window.addEventListener('beforeprint', () => {
  if (document.activeElement?.isContentEditable) document.activeElement.blur();
  chart.style.zoom = '';
  if (!state.fitPage) return;
  const p = PAPERS[state.paper], z = Math.min(1, p.w / chart.scrollWidth, p.h / chart.scrollHeight);
  if (z < 1) chart.style.zoom = z.toFixed(4);
});
window.addEventListener('afterprint', () => { chart.style.zoom = ''; });

renderAll();
})();
</script>
</body>
